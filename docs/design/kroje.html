<h1>Kierunek A: pięć krojów tytułowych na tym samym ekranie</h1>
<p class="pod">Zmienia się tylko krój tytułu kroku i czasu. Treść: na iOS SF Pro, w makiecie Noto Sans. Związki z dziedziną to obserwacje studia [OCENA], nie fakty z źródeł. Pisma: z pliku METADATA kroju (Google Fonts), sprawdzone przy pobraniu.</p>
<div class="siatka">
<figure><iframe src="kierunki/a-koszyk.html?kroj=Alegreya%20Sans"></iframe><figcaption><b>1. Alegreya Sans</b>Humanistyczny, z rytmem pióra; pasuje do rękodzieła i plecionki koszyka. Pisma: łacinka, cyrylica, greka, wietnamski.</figcaption></figure>
<figure><iframe src="kierunki/a-koszyk.html?kroj=Sofia%20Sans%20Semi%20Condensed"></iframe><figcaption><b>2. Sofia Sans Semi Condensed</b>Wąskie liternictwo jak na szyldach i witrynach piekarni; mieści długie nazwy kroków. Pisma: łacinka, cyrylica, greka.</figcaption></figure>
<figure><iframe src="kierunki/a-koszyk.html?kroj=Bitter"></iframe><figcaption><b>3. Bitter</b>Szeryf blokowy jak nadruk na papierowym worku mąki i pieczątka piekarni. Pisma: łacinka, cyrylica, wietnamski (bez greki).</figcaption></figure>
<figure><iframe src="kierunki/a-koszyk.html?kroj=Big%20Shoulders%20Stencil"></iframe><figcaption><b>4. Big Shoulders Stencil</b>Szablon jak na workach i skrzyniach z mąką. Pisma: tylko łacinka i wietnamski — ryzyko dla 35 języków.</figcaption></figure>
<figure><iframe src="kierunki/a-koszyk.html?kroj=Rubik"></iframe><figcaption><b>5. Rubik</b>Zaokrąglone narożniki jak bochenek i ciasto. Pisma: łacinka, cyrylica, arabski, hebrajski (bez greki).</figcaption></figure>
</div>
