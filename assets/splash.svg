    <text x="500" y="705" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" fill="#B35E24" letter-spacing="6" text-anchor="middle">TRUE BAKER’S % · DDT · ZAKWAS</text>

