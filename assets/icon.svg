<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Ceramic Basalt gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#18181C"/>
      <stop offset="100%" stop-color="#121214"/>
    </radialGradient>

    <!-- Metallic Crust Gold gradients -->
    <linearGradient id="crustGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E5C9"/>
      <stop offset="30%" stop-color="#D49B42"/>
      <stop offset="70%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <linearGradient id="earHighlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#EDE4D0"/>
      <stop offset="100%" stop-color="#D49B42"/>
    </linearGradient>

    <radialGradient id="plateGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#242428"/>
      <stop offset="85%" stop-color="#1C1C1F"/>
      <stop offset="100%" stop-color="#18181B"/>
    </radialGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#D49B42" flood-opacity="0.22"/>
    </filter>

    <filter id="plateShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 1. Deep Ceramic Basalt Background (Solid 1024x1024, no transparency) -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>

  <!-- 2. Circular Ceramic Rzemiosło Platter -->
  <circle cx="512" cy="512" r="410" fill="url(#plateGrad)" stroke="#2E2E34" stroke-width="4" filter="url(#plateShadow)"/>
  <circle cx="512" cy="512" r="392" fill="none" stroke="#26262B" stroke-width="2" opacity="0.6"/>

  <!-- 3. Piekarz Metallic Artisan Loaf Emblem (Scaled & Embossed) -->
  <g filter="url(#subtleGlow)" transform="translate(112, 112)">
    <!-- Base Baking Stone Line -->
    <path d="M 160 620 L 640 620" stroke="url(#crustGoldGrad)" stroke-width="24" stroke-linecap="round"/>
    <path d="M 200 645 L 600 645" stroke="#3E3E46" stroke-width="8" stroke-linecap="round" opacity="0.6"/>

    <!-- Artisan Sourdough Boule Main Body -->
    <path d="M 200 580 C 200 360, 310 210, 400 210 C 490 210, 600 360, 600 580 Z"
          fill="none"
          stroke="url(#crustGoldGrad)"
          stroke-width="32"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- The Great Ear (Grigne / Artisan Sourdough Cut) -->
    <path d="M 290 500 C 350 400, 430 380, 520 450"
          fill="none"
          stroke="url(#earHighlightGrad)"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Wheat Ear Feather Cuts (Nacięcie Kłosa) -->
    <!-- First Leaf -->
    <path d="M 340 430 L 380 370" stroke="url(#crustGoldGrad)" stroke-width="18" stroke-linecap="round"/>
    <!-- Second Leaf -->
    <path d="M 405 385 L 445 325" stroke="url(#earHighlightGrad)" stroke-width="20" stroke-linecap="round"/>
    <!-- Third Leaf -->
    <path d="M 465 415 L 495 365" stroke="url(#crustGoldGrad)" stroke-width="18" stroke-linecap="round"/>

    <!-- Flour Dust Specular Particles (Banneton Rings) -->
    <circle cx="360" cy="270" r="6" fill="#EDE4D0" opacity="0.7"/>
    <circle cx="440" cy="265" r="5" fill="#EDE4D0" opacity="0.8"/>
    <circle cx="310" cy="330" r="5" fill="#EDE4D0" opacity="0.5"/>
    <circle cx="490" cy="320" r="7" fill="#EDE4D0" opacity="0.6"/>
  </g>
</svg>
