<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Piekarz (Crust) — Oficjalna ikona aplikacji Apps4Brew Studio -->
  <!-- Tło lniano-pergaminowe bez przezroczystości (wymóg Apple App Store HIG) -->
  <rect width="1024" height="1024" fill="#FBF9F5"/>

  <g transform="translate(112, 112)">
    <!-- Delikatny cień bochenka -->
    <ellipse cx="400" cy="680" rx="360" ry="45" fill="#E8E1D5" opacity="0.8"/>

    <!-- Kłos pszenicy w tle (subtelny kontur rzemieślniczy) -->
    <g opacity="0.25" stroke="#B8945A" stroke-width="12" stroke-linecap="round" fill="none">
      <path d="M 120 720 Q 280 400 480 180"/>
      <ellipse cx="380" cy="280" rx="28" ry="12" transform="rotate(-35 380 280)" fill="#D4AF37"/>
      <ellipse cx="440" cy="240" rx="28" ry="12" transform="rotate(25 440 240)" fill="#D4AF37"/>
      <ellipse cx="320" cy="360" rx="28" ry="12" transform="rotate(-40 320 360)" fill="#D4AF37"/>
      <ellipse cx="380" cy="320" rx="28" ry="12" transform="rotate(20 380 320)" fill="#D4AF37"/>
      <ellipse cx="260" cy="450" rx="28" ry="12" transform="rotate(-45 260 450)" fill="#D4AF37"/>
      <ellipse cx="320" cy="410" rx="28" ry="12" transform="rotate(15 320 410)" fill="#D4AF37"/>
    </g>

    <!-- Główna bryła bochenka chleba wiejskiego na zakwasie (Boule / Batard) -->
    <!-- Dolna część bochenka -->
    <path d="M 120 540 C 120 660, 220 700, 400 700 C 580 700, 680 660, 680 540 C 680 420, 620 330, 400 330 C 180 330, 120 420, 120 540 Z" fill="#8D491E" stroke="#4A260F" stroke-width="18"/>

    <!-- Górna kopuła z wypieczoną, karmelizowaną skórką -->
    <path d="M 135 520 C 135 370, 220 290, 400 290 C 580 290, 665 370, 665 520 C 665 620, 560 670, 400 670 C 240 670, 135 620, 135 520 Z" fill="#B35E24"/>

    <!-- Blask i rumiana skórka (caramelization gradient effect) -->
    <path d="M 170 480 C 170 360, 250 315, 400 315 C 550 315, 630 360, 630 480 C 630 540, 540 610, 400 610 C 260 610, 170 540, 170 480 Z" fill="#C97532"/>

    <!-- Nacięcie rzemieślnicze z potężnym otwartym uchem (Artisan Sourdough Ear / Grigne) -->
    <!-- Wnętrze nacięcia (odkryty, puszysty, jasny miękisz) -->
    <path d="M 210 510 C 270 380, 440 370, 580 470 C 520 440, 410 420, 290 490 C 250 510, 225 515, 210 510 Z" fill="#F4E6C3" stroke="#D1B87D" stroke-width="6"/>

    <!-- Wystająca chrupiąca krawędź ucha bochenka (The Blistered Ear) -->
    <path d="M 200 500 C 270 360, 460 350, 600 460 C 540 410, 420 380, 290 460 C 240 485, 215 498, 200 500 Z" fill="#5E2A0A" stroke="#3D1804" stroke-width="10"/>

    <!-- Pęcherzyki powietrza i mikro-chrupkość na skórce (blistering) -->
    <circle cx="270" cy="410" r="14" fill="#F5E4B8" opacity="0.6"/>
    <circle cx="310" cy="380" r="10" fill="#F5E4B8" opacity="0.7"/>
    <circle cx="480" cy="390" r="12" fill="#F5E4B8" opacity="0.6"/>
    <circle cx="530" cy="430" r="16" fill="#F5E4B8" opacity="0.5"/>
    <circle cx="230" cy="470" r="8" fill="#F5E4B8" opacity="0.7"/>
    <circle cx="570" cy="480" r="10" fill="#F5E4B8" opacity="0.6"/>

    <!-- Oprószenie mąką z koszyka rozrostowego (Banneton flour dust rings) -->
    <path d="M 220 370 C 280 345, 350 335, 420 338" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.65"/>
    <path d="M 200 410 C 260 380, 330 368, 400 370" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.55"/>
    <path d="M 190 450 C 240 420, 300 405, 360 410" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.5"/>

    <!-- Dodatkowe nacięcia dekoracyjne w kształcie kłosa (wheat ear scoring) -->
    <g stroke="#66300E" stroke-width="8" stroke-linecap="round">
      <path d="M 330 550 L 360 520"/>
      <path d="M 360 550 L 390 520"/>
      <path d="M 400 555 L 430 525"/>
      <path d="M 440 560 L 470 530"/>
    </g>

    <!-- Znak jakości piekarskiej Apps4Brew — mała odznaka w prawym dolnym rogu -->
    <g transform="translate(560, 570)">
      <circle cx="70" cy="70" r="64" fill="#2E1C0C" stroke="#D4AF37" stroke-width="8"/>
      <text x="70" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#D4AF37" text-anchor="middle">A4B</text>
      <text x="70" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">100%</text>
    </g>
  </g>
</svg>
