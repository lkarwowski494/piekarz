# Prawdziwe E2E na symulatorze iOS; elementy tylko po id, bez tekstów języka (M1-audytor-generalny-037, 07-jakosc-501).
# Prawdziwe E2E na symulatorze iOS: prowadzenie w widoku skupionym (design-spec 11b "056", punkt 6;
# M1-audytor-generalny-056). Bez przewijania widac tytul kroku, czas i pasek kciuka z "Zrobione".
# Polozenie "Zrobione" w dolnych 30% ekranu przy 320 i 390 pt sprawdza rola 07 na urzadzeniu (zrzut).
appId: com.apps4brew.baker
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible:
      id: "start-czynnosci"
    timeout: 60000
- tapOn:
    id: "tab-receptury"
# Lista receptur -> ekran receptury; "Uloz plan" w pierwszym widoku bez przewijania (M1-audytor-generalny-106).
# Receptura z zakwasem: "Uloz plan" aktywny takze po D-3 (receptura bez zakwasu - nieaktywny).
- tapOn:
    id: "recipe-row-country_loaf_72"
- assertVisible:
    id: "start-bake-btn"
- tapOn:
    id: "start-bake-btn"
- scrollUntilVisible:
    element:
      id: "plan-start-bake-btn"
- tapOn:
    id: "plan-start-bake-btn"
# Zdanie "po co" przed prosba iOS o zgode (ZgodaPowiadomien, M1-audytor-generalny-130) pokazuje sie, gdy zgoda
# jest nieustalona - na runnerze macos-26 mimo launchApp permissions (przebieg 39688253940, zrzut z chwili bledu).
# "Dalej" wywoluje systemowe okno zgody; jego przycisk nie ma id (okno iOS, nie aplikacji), stad tekst systemu
# w obu jezykach przebiegu. Oba kroki opcjonalne: przy zgodzie juz nadanej okien nie ma.
- tapOn:
    id: "zgoda-dalej-btn"
    optional: true
- tapOn:
    text: "Pozwalaj|Zezwalaj|Zezwól|Allow"
    optional: true
- extendedWaitUntil:
    visible:
      id: "step-title"
    timeout: 15000
- assertVisible:
    id: "step-time"
- assertVisible:
    id: "thumb-bar"
- assertVisible:
    id: "next-or-finish-step-btn"
- assertVisible:
    id: "step-undo-btn"
- assertVisible:
    id: "step-why-btn"
- assertNotVisible:
    id: "discard-bake-btn"
