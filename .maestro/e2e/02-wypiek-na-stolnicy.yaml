# Prawdziwe E2E na symulatorze iOS; elementy tylko po id, bez tekstów języka (M1-audytor-generalny-037, 07-jakosc-501).
# Prawdziwe E2E na symulatorze iOS (M1-audytor-generalny-037, 07-jakosc-005).
# Glowny przeplyw (D-051 2a, M1-audytor-generalny-101): Start -> zakladki Zakwasy i Dziennik -> Receptury ->
# start wypieku -> prowadzenie bez paska zakladek -> nastepny krok; po ponownym uruchomieniu stukniecie w spirale
# trwajacego wypieku na Dzis jednym dotknieciem wraca do prowadzenia (F-58, D-122).
appId: com.apps4brew.baker
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible:
      id: "start-czynnosci"
    timeout: 60000
- tapOn:
    id: "tab-zakwasy"
- assertVisible:
    id: "zakwas-doctor-shortcut-btn"
- tapOn:
    id: "tab-dziennik"
- assertVisible:
    id: "dziennik-doktor-btn"
- tapOn:
    id: "tab-receptury"
# Lista receptur -> ekran receptury; "Uloz plan" w pierwszym widoku bez przewijania (M1-audytor-generalny-106).
# Receptura z zakwasem: "Uloz plan" aktywny takze po D-3 (receptura bez zakwasu - nieaktywny).
- tapOn:
    id: "recipe-row-country_loaf_72"
- assertVisible:
    id: "start-bake-btn"
# "Uloz plan" (start-bake-btn, M1-audytor-generalny-057) otwiera plan wypieku; "Zacznij wypiek" na planie
- tapOn:
    id: "start-bake-btn"
- scrollUntilVisible:
    element:
      id: "plan-start-bake-btn"
- tapOn:
    id: "plan-start-bake-btn"
# Zdanie "po co" przed prosba iOS o zgode (ZgodaPowiadomien, M1-audytor-generalny-130) pokazuje sie, gdy zgoda
# jest nieustalona - na runnerze macos-26 mimo launchApp permissions (przebieg 39688253940, zrzut z chwili bledu).
# "Dalej" wywoluje systemowe okno zgody; jego przycisk nie ma id (okno iOS, nie aplikacji), stad tekst systemu
# w obu jezykach przebiegu. Oba kroki opcjonalne: przy zgodzie juz nadanej okien nie ma.
# E2E-95: arkusz zgody otwiera sie po odpowiedzi systemu (run 42498413474: 7,15 s), wiec czekanie warunkowe
# (optional: arkusza nie ma, gdy zgoda juz ustalona) i stukniecie bez optional, gdy arkusz jest
- extendedWaitUntil:
    visible:
      id: "zgoda-dalej-btn"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible:
        id: "zgoda-dalej-btn"
    commands:
      - tapOn:
          id: "zgoda-dalej-btn"
      # E2E-96: okno systemu iOS (bez id) otwiera sie po odpowiedzi systemu na prosbe o zgode, wiec jak arkusz wyzej:
      # czekanie warunkowe i stukniecie bez optional, gdy okno jest. Tylko po "Dalej": bez arkusza okna nie ma
      - extendedWaitUntil:
          visible:
            text: "Pozwalaj|Zezwalaj|Zezwól|Allow"
          timeout: 30000
          optional: true
      - runFlow:
          when:
            visible:
              text: "Pozwalaj|Zezwalaj|Zezwól|Allow"
          commands:
            - tapOn:
                text: "Pozwalaj|Zezwalaj|Zezwól|Allow"
- extendedWaitUntil:
    visible:
      id: "next-or-finish-step-btn"
    timeout: 15000
- tapOn:
    id: "next-or-finish-step-btn"
- assertVisible:
    id: "next-or-finish-step-btn"
- launchApp:
    permissions:
      notifications: allow
# Powrot przez spirale trwajacego wypieku (spirala-otworz, D-122): na Dzis lezy nad paskiem zakladek (bounds
# [91,544][311,764], tabbar od 791). "Wroc do wypieku" (resume-bake-btn) jest pod spirala poza ekranem (karta
# start-trwa-wypiek do y 947 przy ekranie 874): czekanie na jego widocznosc padlo przed przewinieciem (przebieg
# 39873090932, krok 20), a dotkniecie bez przewiniecia trafialo w pasek zakladek (przebieg 39863216388, krok 23).
- extendedWaitUntil:
    visible:
      id: "spirala-otworz"
    timeout: 60000
- tapOn:
    id: "spirala-otworz"
- extendedWaitUntil:
    visible:
      id: "next-or-finish-step-btn"
    timeout: 15000
# Zrzut punktu kontrolnego na końcu scenariusza (artefakt zrzuty-e2e) [M1-audytor-generalny-075]
- takeScreenshot: "zrzuty-e2e/${JEZYK}-02-wypiek-na-stolnicy"
