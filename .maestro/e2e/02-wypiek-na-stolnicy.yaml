# Prawdziwe E2E na symulatorze iOS; elementy tylko po id, bez tekstów języka (M1-audytor-generalny-037, 07-jakosc-501).
# Prawdziwe E2E na symulatorze iOS (M1-audytor-generalny-037, 07-jakosc-005).
# Glowny przeplyw (D-051 2a, M1-audytor-generalny-101): Start -> zakladki Zakwasy i Dziennik -> Receptury ->
# start wypieku -> prowadzenie bez paska zakladek -> nastepny krok; po ponownym uruchomieniu "Wroc do wypieku"
# na Starcie jednym dotknieciem wraca do prowadzenia (F-58).
appId: com.apps4brew.baker
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible:
      id: "start-czynnosci"
    timeout: 60000
- tapOn:
    id: "tab-zakwasy"
- assertVisible:
    id: "zakwas-doctor-shortcut-btn"
- tapOn:
    id: "tab-dziennik"
- assertVisible:
    id: "dziennik-doktor-btn"
- tapOn:
    id: "tab-receptury"
# Lista receptur -> ekran receptury; "Uloz plan" w pierwszym widoku bez przewijania (M1-audytor-generalny-106).
# Receptura z zakwasem: "Uloz plan" aktywny takze po D-3 (receptura bez zakwasu - nieaktywny).
- tapOn:
    id: "recipe-row-country_loaf_72"
- assertVisible:
    id: "start-bake-btn"
# "Uloz plan" (start-bake-btn, M1-audytor-generalny-057) otwiera plan wypieku; "Zacznij wypiek" na planie
- tapOn:
    id: "start-bake-btn"
- scrollUntilVisible:
    element:
      id: "plan-start-bake-btn"
- tapOn:
    id: "plan-start-bake-btn"
# Zdanie "po co" przed prosba iOS o zgode (ZgodaPowiadomien, M1-audytor-generalny-130) pokazuje sie, gdy zgoda
# jest nieustalona - na runnerze macos-26 mimo launchApp permissions (przebieg 39688253940, zrzut z chwili bledu).
# "Dalej" wywoluje systemowe okno zgody; jego przycisk nie ma id (okno iOS, nie aplikacji), stad tekst systemu
# w obu jezykach przebiegu. Oba kroki opcjonalne: przy zgodzie juz nadanej okien nie ma.
- tapOn:
    id: "zgoda-dalej-btn"
    optional: true
- tapOn:
    text: "Pozwalaj|Zezwalaj|Zezwól|Allow"
    optional: true
- extendedWaitUntil:
    visible:
      id: "next-or-finish-step-btn"
    timeout: 15000
- tapOn:
    id: "next-or-finish-step-btn"
- assertVisible:
    id: "next-or-finish-step-btn"
- launchApp:
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible:
      id: "resume-bake-btn"
    timeout: 60000
# "Wroc do wypieku" lezy na Dzis pod spirala (D4b, 220 pt), poza ekranem na symulatorze (bounds y 815-879 przy tabbarze od 791):
# bez przewiniecia dotkniecie trafialo w pasek zakladek i flow zostawal na Dzis (przebieg 39863216388, krok 23).
- scrollUntilVisible:
    element:
      id: "resume-bake-btn"
- tapOn:
    id: "resume-bake-btn"
- extendedWaitUntil:
    visible:
      id: "next-or-finish-step-btn"
    timeout: 15000
