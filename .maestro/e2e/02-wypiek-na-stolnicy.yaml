# Prawdziwe E2E na symulatorze iOS (M1-audytor-generalny-037, 07-jakosc-005).
# Glowny przeplyw (D-051 2a, M1-audytor-generalny-101): Start -> zakladki Zakwasy i Dziennik -> Receptury ->
# start wypieku -> prowadzenie bez paska zakladek -> nastepny krok; po ponownym uruchomieniu "Wroc do wypieku"
# na Starcie jednym dotknieciem wraca do prowadzenia (F-58).
appId: com.apps4brew.baker
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "start-czynnosci"
    timeout: 60000
- tapOn: "Zakwasy"
- assertVisible:
    id: "zakwas-doctor-shortcut-btn"
- tapOn: "Dziennik"
- assertVisible:
    id: "dziennik-doktor-btn"
- tapOn: "Receptury"
# "Uloz plan" (start-bake-btn, M1-audytor-generalny-057) otwiera plan wypieku; "Zacznij wypiek" na planie
- tapOn:
    id: "start-bake-btn"
- scrollUntilVisible:
    element:
      id: "plan-start-bake-btn"
- tapOn:
    id: "plan-start-bake-btn"
- assertVisible:
    id: "next-or-finish-step-btn"
- tapOn:
    id: "next-or-finish-step-btn"
- assertVisible:
    id: "next-or-finish-step-btn"
- launchApp
- extendedWaitUntil:
    visible:
      id: "resume-bake-btn"
    timeout: 60000
- tapOn:
    id: "resume-bake-btn"
- assertVisible:
    id: "next-or-finish-step-btn"