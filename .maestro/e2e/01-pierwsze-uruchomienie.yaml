# Prawdziwe E2E na symulatorze iOS; elementy tylko po id, bez tekstów języka (M1-audytor-generalny-037, 07-jakosc-501).
# Prawdziwe E2E na symulatorze iOS (M1-audytor-generalny-037, 07-jakosc-005).
# Pierwsze uruchomienie: Start "Co dzis robisz?" z trzema czynnosciami (BR-START-001, M1-audytor-generalny-101),
# wybor "Pieke na zakwasie" otwiera Receptury bez oferty (D-047).
appId: com.apps4brew.baker
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible:
      id: "start-czynnosci"
    timeout: 60000
- assertVisible:
    id: "start-zakladam-zakwas"
- assertVisible:
    id: "start-pieke-na-drozdzach"
- tapOn:
    id: "start-pieke-na-zakwasie"
# Receptury: lista receptur jako ekran glowny (M1-audytor-generalny-106), wiersz otwiera ekran receptury
- assertVisible:
    id: "recipe-list"
- tapOn:
    id: "recipe-row-country_loaf_72"
- assertVisible:
    id: "stat-hydration"