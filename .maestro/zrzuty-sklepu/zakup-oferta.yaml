# Kontrola po scenie zakup.yaml (bez restartu): czy sklep zwrócił ofertę (plany z ceną i warunki subskrypcji).
# Symulator bez konfiguracji StoreKit zwykle jej nie ma (stan „niedostępna”, PaywallModal.tsx) — wtedy zrzut nie trafia
# do `review/`, tylko do `bez-oferty/` (scripts/ci/zrzuty-sklepu.sh).
appId: com.apps4brew.baker
---
- extendedWaitUntil:
    visible:
      id: "subscription-terms"
    timeout: 20000
- assertVisible:
    id: "plan-yearly-btn"
