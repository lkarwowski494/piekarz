# Ramka 04 „Doktor Chleba”: objaw „Jaskinie” i wynik diagnozy w środku kadru.
appId: com.apps4brew.baker
---
- runFlow: sub/start.yaml
- tapOn:
    id: "tab-dziennik"
- tapOn:
    id: "dziennik-doktor-btn"
- scrollUntilVisible:
    element:
      id: "objaw-crumbHasHugeTopHolesWithDenseBottom"
- tapOn:
    id: "objaw-crumbHasHugeTopHolesWithDenseBottom"
# NaglowekKarty renderuje `karta-diagnoza-naglowek`, nie samo `karta-diagnoza` (zrzuty #2, D-375)
- scrollUntilVisible:
    element:
      id: "karta-diagnoza-naglowek"
    centerElement: true
