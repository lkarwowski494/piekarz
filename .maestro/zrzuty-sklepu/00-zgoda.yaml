# Raz na zadanie, w en-US (scripts/ci/zrzuty-sklepu.sh): pierwsze dokarmienie wywołuje prośbę o zgodę na powiadomienia,
# okno systemu ma wtedy angielski przycisk „Allow”. Decyzja systemu zostaje przy zmianie języka i przy clearState,
# bo aplikacja nie jest instalowana ponownie [DO USTALENIA w pierwszym przebiegu: czy clearState Maestro jej nie kasuje].
appId: com.apps4brew.baker
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible:
      id: "start-czynnosci"
    timeout: 60000
- tapOn:
    id: "tab-zakwasy"
- scrollUntilVisible:
    element:
      id: "zakladanie-pierwsze-dokarmienie-btn"
- tapOn:
    id: "zakladanie-pierwsze-dokarmienie-btn"
- runFlow: sub/okno-systemu.yaml
# Zakwas w zakładaniu: karta zakładania stoi nad kartą cyklu (`zakwas-karta` poza ekranem, zrzuty #1, D-371);
# czekanie jak E2E 05-drugi-zakwas-pro (start zakładania znika) i na pas zakwasu na górze ekranu
- extendedWaitUntil:
    notVisible:
      id: "zakladanie-start"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "zakwas-cykl"
    timeout: 15000
