# Zdanie „po co” przed prośbą o zgodę (ZgodaPowiadomien, zgoda-dalej-btn) i okno systemu iOS (jak .maestro/e2e/02-wypiek-na-stolnicy.yaml,
# E2E-95, E2E-96). Arkusz aplikacji ma id, okno systemu nie (sub/okno-systemu.yaml).
appId: com.apps4brew.baker
---
- extendedWaitUntil:
    visible:
      id: "zgoda-dalej-btn"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible:
        id: "zgoda-dalej-btn"
    commands:
      - tapOn:
          id: "zgoda-dalej-btn"
- runFlow: okno-systemu.yaml
