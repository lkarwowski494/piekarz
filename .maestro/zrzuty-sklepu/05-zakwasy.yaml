# Ramka 05 „Zakwasy”: zakwas z 00-przygotuj.yaml, cykl dokarmiania.
appId: com.apps4brew.baker
---
- runFlow: sub/start.yaml
- tapOn:
    id: "tab-zakwasy"
# Pas zakwasu ze spiralą cyklu (D-371); zakwas po zakładaniu z 00-przygotuj (KO-043, D-372): karta cyklu
# z „Gotowy do ciasta.” nad profilem od D-393 (zrzut robi simctl io po scenie)
- extendedWaitUntil:
    visible:
      id: "zakwas-cykl"
    timeout: 15000
# KO-055 (D-393): karta cyklu nad profilem — bez przewijania pas ze spiralą i „Gotowy do ciasta.” są w kadrze na 6,3″
# i 6,9″ (rachunek: tests/zrzuty-sklepu-kadry.test.ts); asercja pilnuje „Gotowy do ciasta.” (KO-043).
- assertVisible:
    id: "zakwas-gotowy"
