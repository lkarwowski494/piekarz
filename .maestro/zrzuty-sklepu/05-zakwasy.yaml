# Ramka 05 „Zakwasy”: zakwas z 00-przygotuj.yaml, cykl dokarmiania.
appId: com.apps4brew.baker
---
- runFlow: sub/start.yaml
- tapOn:
    id: "tab-zakwasy"
# Pas zakwasu ze spiralą cyklu (D-371); zakwas po zakładaniu z 00-przygotuj (KO-043, D-372): karta cyklu
# z „Gotowy do ciasta.” pod profilem, przewinięta na środek ekranu (zrzut robi simctl io po scenie)
- extendedWaitUntil:
    visible:
      id: "zakwas-cykl"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "zakwas-gotowy"
    centerElement: true
