# Zrzuty sklepu (KO-025, 2026-11-10): dane FIKCYJNE dla scen 01–07 — zakwas założony w aplikacji (pierwsze dokarmienie)
# i jeden zakończony wypiek wbudowanej receptury z oceną 4 (wpis w Dzienniku). Bez danych właściciela, bez wpisywania tekstu.
# Build z dostępem E2E (EXPO_PUBLIC_E2E=1, pełny Pro), jak .maestro/e2e/06-koniec-wypieku.yaml. Elementy tylko po id.
appId: com.apps4brew.baker
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible:
      id: "start-czynnosci"
    timeout: 60000
# Zakwas: zakładanie od zera, pierwsze dokarmienie tworzy zakwas (BR-ZAKW-005)
- tapOn:
    id: "tab-zakwasy"
- scrollUntilVisible:
    element:
      id: "zakladanie-pierwsze-dokarmienie-btn"
- tapOn:
    id: "zakladanie-pierwsze-dokarmienie-btn"
# Okno zgody systemu po pierwszym dokarmieniu (E2E-96; recenzja J, P0); zwykle już rozstrzygnięte przez 00-zgoda.yaml
- runFlow: sub/okno-systemu.yaml
# Zakwas w zakładaniu: karta zakładania stoi nad kartą cyklu (`zakwas-karta` poza ekranem, zrzuty #1, D-371);
# czekanie jak E2E 05-drugi-zakwas-pro (start zakładania znika) i na pas zakwasu na górze ekranu
- extendedWaitUntil:
    notVisible:
      id: "zakladanie-start"
    timeout: 15000
# Zrzuty #2 (D-374): na 6,3″ w pl ekran jest przewinięty w dół do przycisku dokarmienia, pas leży nad kadrem;
# przewijanie w górę z limitem czasu czeka na pas (powstaje po dokarmieniu) i przywraca go do kadru na każdym rozmiarze
- scrollUntilVisible:
    element:
      id: "zakwas-cykl"
    direction: UP
    timeout: 15000
# Ramka 05 = zakwas po zakładaniu (KO-043, D-372): „Podwoił objętość” w 0–8 h po dokarmieniu kończy zakładanie
# (isReadyAfterFeeding, setupCompletedAt); wynik „ready” w karcie zakładania nad kartą cyklu
- scrollUntilVisible:
    element:
      id: "zakwas-podwoil-btn"
- tapOn:
    id: "zakwas-podwoil-btn"
- scrollUntilVisible:
    element:
      id: "zakladanie-wynik-ready"
    direction: UP
# Wypiek do końca z oceną (wpis w Dzienniku)
- tapOn:
    id: "tab-receptury"
- tapOn:
    id: "recipe-row-country_loaf_72"
- tapOn:
    id: "start-bake-btn"
- scrollUntilVisible:
    element:
      id: "plan-start-bake-btn"
- tapOn:
    id: "plan-start-bake-btn"
- runFlow: sub/zgoda.yaml
- extendedWaitUntil:
    visible:
      id: "step-title"
    timeout: 15000
- tapOn:
    id: "bake-plan-btn"
- scrollUntilVisible:
    element:
      id: "plan-krok-ostatni"
- tapOn:
    id: "plan-krok-ostatni"
- extendedWaitUntil:
    visible:
      id: "next-or-finish-step-btn"
    timeout: 15000
- tapOn:
    id: "next-or-finish-step-btn"
- extendedWaitUntil:
    visible:
      id: "finish-rating-star-4"
    timeout: 15000
- tapOn:
    id: "finish-rating-star-4"
- tapOn:
    id: "finish-save-btn"
- tapOn:
    id: "tab-dziennik"
- extendedWaitUntil:
    visible:
      id: "bake-log-card-.*"
    timeout: 15000
