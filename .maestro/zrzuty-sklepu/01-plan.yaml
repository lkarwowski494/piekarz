# Ramka 01 „Plan wstecz” (docs/wydanie/zrzuty/README.md, D-055): plan wypieku wbudowanej receptury. Godziny planu zależą
# od zegara maszyny (aplikacja nie ma wstrzykiwanego zegara) — patrz README, „Zrzuty natywne”.
appId: com.apps4brew.baker
---
- runFlow: sub/start.yaml
- tapOn:
    id: "tab-receptury"
- tapOn:
    id: "recipe-row-country_loaf_72"
- tapOn:
    id: "start-bake-btn"
- extendedWaitUntil:
    visible:
      id: "plan-dzien-2"
    timeout: 15000
# Zrzuty #4 (KO-048 P2): na 6,3″ karty „Ochrona snu aktywna” nie było w kadrze, na 6,9″ jej treść leżała pod paskiem
# przycisków. Treść karty (sleep-guard-banner) na środku ekranu; karta istnieje, gdy plan omija godziny snu
# (przy innej godzinie maszyny może to być karta kolizji z tym samym id) [DO USTALENIA w przebiegu].
- scrollUntilVisible:
    element:
      id: "sleep-guard-banner"
    centerElement: true
