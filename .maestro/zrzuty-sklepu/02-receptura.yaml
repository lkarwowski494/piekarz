# Ramka 02 „Receptura”: ekran receptury z ilościami „Do miski” i „Ułóż plan” w pierwszym widoku.
appId: com.apps4brew.baker
---
- runFlow: sub/start.yaml
- tapOn:
    id: "tab-receptury"
- tapOn:
    id: "recipe-row-country_loaf_72"
- extendedWaitUntil:
    visible:
      id: "start-bake-btn"
    timeout: 15000
- assertVisible:
    id: "loaves-count-display"
# Zrzuty #4 (KO-048 P2): na 6,3″ jeden pełny składnik. Wiersz „Woda” na środku ekranu: nad nim pełne wiersze mąki,
# pod nim zakwas i sól. Liczba bochenków sprawdzona wyżej, bo po przewinięciu karta „Ile pieczesz” może wyjść z kadru.
- scrollUntilVisible:
    element:
      id: "scale-item-water"
    centerElement: true
