# Zrzuty sklepu, część 2 przygotowania (KO-049, D-385): po 00-przygotuj.yaml (dokarmienie o 03:35) skrypt przestawia zegar
# maszyny na 09:35; tu „Podwoił objętość” 6 h po dokarmieniu i jeden zakończony wypiek wbudowanej receptury z oceną 4.
# Bez czyszczenia stanu, bez wpisywania tekstu. Elementy tylko po id.
appId: com.apps4brew.baker
---
- runFlow: sub/start.yaml
- tapOn:
    id: "tab-zakwasy"
# Ramka 05 = zakwas po zakładaniu (KO-043, D-372): „Podwoił objętość” w 0–8 h po dokarmieniu kończy zakładanie
# (isReadyAfterFeeding, setupCompletedAt); wynik „ready” w karcie zakładania nad kartą cyklu
# Zrzuty #8 (D-394): bez centerElement środek przycisku leżał w pasie kart (6,9″ de-DE y 885–933, pasek od 873) i stuknięcie
# trafiło w kartę „Zakwasy” w 7 lokalizacjach; centerElement (Maestro 2.11: środek elementu powyżej 70% wysokości ekranu,
# D-394) kładzie go nad paskiem; po 5 nieudanych próbach Maestro wraca do samej widoczności (element na końcu treści).
- scrollUntilVisible:
    element:
      id: "zakwas-podwoil-btn"
    centerElement: true
    # 5 prób wyśrodkowania po ~4–5 s, gdy element jest na końcu treści (D-377): limit ponad domyślne 20 s (D-394)
    timeout: 30000
- tapOn:
    id: "zakwas-podwoil-btn"
- scrollUntilVisible:
    element:
      id: "zakladanie-wynik-ready"
    direction: UP
# Wypiek do końca z oceną (wpis w Dzienniku)
- tapOn:
    id: "tab-receptury"
- tapOn:
    id: "recipe-row-country_loaf_72"
- tapOn:
    id: "start-bake-btn"
- scrollUntilVisible:
    element:
      id: "plan-start-bake-btn"
- tapOn:
    id: "plan-start-bake-btn"
- runFlow: sub/zgoda.yaml
- extendedWaitUntil:
    visible:
      id: "step-title"
    timeout: 15000
- tapOn:
    id: "bake-plan-btn"
- scrollUntilVisible:
    element:
      id: "plan-krok-ostatni"
- tapOn:
    id: "plan-krok-ostatni"
- extendedWaitUntil:
    visible:
      id: "next-or-finish-step-btn"
    timeout: 15000
- tapOn:
    id: "next-or-finish-step-btn"
- extendedWaitUntil:
    visible:
      id: "finish-rating-star-4"
    timeout: 15000
- tapOn:
    id: "finish-rating-star-4"
- tapOn:
    id: "finish-save-btn"
# Po zapisie Stolnica robi router.replace('/') (app/stolnica.tsx:62-64): czekamy na Dziś przed stuknięciem zakładki [KO-061]
- extendedWaitUntil:
    visible:
      id: "start-czynnosci"
    timeout: 15000
- tapOn:
    id: "tab-dziennik"
- runFlow:
    when:
      notVisible:
        id: "bake-log-card-.*"
    commands:
      - tapOn:
          id: "tab-dziennik"
- extendedWaitUntil:
    visible:
      id: "bake-log-card-.*"
    timeout: 15000
