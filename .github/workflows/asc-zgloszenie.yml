name: App Store Connect — zgłoszenie przez API

# Metadane 34 lokalizacji, opisy produktów i zrzut zakupu dla App Review [M1-audytor-generalny-186].
# Uruchamia tylko właściciel ręcznie: Actions → „Run workflow” na master (workflow_dispatch, wybór a 10-wydanie-601),
# więc przebieg na sucho porównuje treść master. Zawsze przebieg na sucho (tylko GET); zapis wyłącznie, gdy
# docs/wydanie/asc-zgoda-zgloszenie.json ma "zapis": true i skrót planu pokazanego właścicielowi. Zrzutów sklepu
# ten workflow nie wgrywa (KO-033, D-366): robi to „ASC zrzuty ekranu” (.github/workflows/asc-zrzuty.yml,
# scripts/asc/zrzuty.mjs, App Asset Library). Zrzut zakupu dla App Review: docs/wydanie/zrzuty/review/zakup.png
# z finalnej aplikacji, tylko gdy w ASC go nie ma (skrypt niczego nie usuwa; inny = podmiana ręczna); bez pliku „czeka”. Ta sama grupa concurrency co asc-ustawienia.yml: dwa przebiegi ASC nigdy naraz.
# Dwa zadania (D-314, M1-audytor-generalny-082): „na-sucho” bez środowiska (kopia zgody z "zapis": false, z tym samym
# „zakres”, więc lista i skrót są te same co przy zapisie); „zapis” tylko przy "zapis": true i po akceptacji
# właściciela w środowisku GitHub `release`.

on:
  workflow_dispatch:

concurrency:
  group: asc-ustawienia
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  na-sucho:
    name: Zgłoszenie ASC na sucho (tylko GET)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      zapis: ${{ steps.zgoda.outputs.zapis }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Zgoda na zapis (plik zgody) i kopia na sucho
        id: zgoda
        run: |
          echo "zapis=$(node -p "require('./docs/wydanie/asc-zgoda-zgloszenie.json').zapis === true")" >> "$GITHUB_OUTPUT"
          node -e "const z = require('./docs/wydanie/asc-zgoda-zgloszenie.json'); z.zapis = false; require('fs').writeFileSync(process.argv[1], JSON.stringify(z))" "$RUNNER_TEMP/zgoda-na-sucho.json"

      - name: Zgłoszenie App Store Connect na sucho (skrypt bez zależności)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 || secrets.ASC_KEY_P8 }}
        run: node scripts/asc-zgloszenie.mjs --zgoda "$RUNNER_TEMP/zgoda-na-sucho.json"

  zapis:
    name: Zgłoszenie ASC — zapis (zgoda w pliku i akceptacja w środowisku release)
    needs: na-sucho
    if: needs.na-sucho.outputs.zapis == 'true'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Zgłoszenie App Store Connect (skrypt bez zależności)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 || secrets.ASC_KEY_P8 }}
        run: node scripts/asc-zgloszenie.mjs --zgoda docs/wydanie/asc-zgoda-zgloszenie.json
