name: App Store Connect — zgłoszenie przez API

# Metadane 34 lokalizacji, zrzuty, opisy produktów i zrzut zakupu dla App Review [M1-audytor-generalny-186].
# Uruchamia tylko właściciel ręcznie: Actions → „Run workflow” na master (workflow_dispatch, wybór a 10-wydanie-601),
# więc przebieg na sucho porównuje treść master. Zawsze przebieg na sucho (tylko GET); zapis wyłącznie, gdy
# docs/wydanie/asc-zgoda-zgloszenie.json ma "zapis": true i skrót planu pokazanego właścicielowi. Zrzuty
# 31 lokalizacji spoza repo porównuje po sumach z docs/wydanie/zrzuty/sumy.json; do ich wysłania potrzebne są pliki
# (paczka w wydaniu wstępnym). Zrzut zakupu dla App Review: docs/wydanie/zrzuty/review/zakup.png z finalnej aplikacji;
# bez pliku pozycje „czeka”. Ta sama grupa concurrency co asc-ustawienia.yml: dwa przebiegi ASC nigdy naraz.

on:
  workflow_dispatch:

concurrency:
  group: asc-ustawienia
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  asc:
    name: Zgłoszenie ASC (na sucho; zapis tylko ze zgodą)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Zrzuty lokalizacji spoza repo: paczka ZIP w wydaniu wstępnym (tag w docs/wydanie/asc-zgloszenie.json, "paczkaZrzutow").
      # Brak wydania = pusty katalog: skrypt porówna po sumach, a zestawów bez plików nie wyśle. Sumy sprawdza skrypt.
      - name: Zrzuty spoza repo (wydanie wstępne)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/zrzuty-sklepu"
          TAG="$(node -p "require('./docs/wydanie/asc-zgloszenie.json').paczkaZrzutow.tag")"
          if gh release download "$TAG" --pattern zrzuty-sklepu.zip --dir "$RUNNER_TEMP"; then
            unzip -q "$RUNNER_TEMP/zrzuty-sklepu.zip" -d "$RUNNER_TEMP/zrzuty-sklepu"
          else
            echo "Brak wydania $TAG: zrzuty spoza repo tylko po sumach"
          fi

      - name: Zgłoszenie App Store Connect (skrypt bez zależności)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 || secrets.ASC_KEY_P8 }}
        run: node scripts/asc-zgloszenie.mjs --zgoda docs/wydanie/asc-zgoda-zgloszenie.json --zrzuty "$RUNNER_TEMP/zrzuty-sklepu"
