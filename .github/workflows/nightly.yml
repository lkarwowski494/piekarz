name: Nightly Deep Verification & Fuzzing

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096
  FORCE_COLOR: '1'

jobs:
  nightly:
    name: Nightly (Random Seed + 1000 Runs + Verify)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      - name: Deep Stateful Fuzzing (1000 runs, random seed)
        env:
          PROP_SEED: random
          FC_NUM_RUNS: 1000
        run: npx jest tests/matrix-invariants.test.ts src/core/__tests__/domain-property-based.test.ts

      - name: Full Quality Gate (npm run verify)
        run: npm run verify

      - name: Stryker Mutation Verification
        run: npm run test:mutation
