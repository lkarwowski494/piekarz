name: Build & Upload to TestFlight (iOS)

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Notatka do wydania (opcjonalnie)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=3072
  FORCE_COLOR: '1'
  APP_SCHEME: 'Piekarz'
  APP_DIR: 'Piekarz'
  BUNDLE_ID: 'com.apps4brew.baker'
  BUILD_BASE: '1'

jobs:
  build:
    name: Archive & Upload (.ipa -> TestFlight)
    runs-on: macos-14
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build_number: ${{ steps.ver.outputs.build_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode 16 (iOS 18 SDK)
        run: bash .github/scripts/select-xcode.sh 16

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      - name: Guard against test/mock flags in release build
        run: |
          for var in EXPO_PUBLIC_STORE_FAKE EXPO_PUBLIC_E2E EXPO_PUBLIC_MOCK_AUTH EXPO_PUBLIC_DEMO_MODE; do
            val="${!var:-}"
            if [ -n "$val" ] && [ "$val" != "0" ]; then
              echo "::error::Flaga testowa $var=$val nie może być ustawiona w wydaniu produkcyjnym!"
              exit 1
            fi
          done

      - name: Run quality gates (Typecheck + Matrix + i18n + Licenses + Tests)
        run: |
          npx tsc --noEmit
          node scripts/test-matrix.mjs --check
          node scripts/check-licenses.mjs
          node scripts/verify-native.mjs
          npx jest --runInBand

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Compute & set monotonic build number
        id: ver
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          BUILD_NUMBER=$((BUILD_BASE + GITHUB_RUN_NUMBER))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Cache CocoaPods
        id: pods-cache
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'package-lock.json') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install CocoaPods
        working-directory: ios
        run: |
          if [ "${{ steps.pods-cache.outputs.cache-hit }}" != "true" ]; then
            pod install --repo-update
          else
            pod install
          fi

      - name: Prepare App Store Connect API Key (.p8) after pod install & archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set +x
          umask 077
          KEY_DIR="$RUNNER_TEMP/asc_private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive (Release, unsigned build step)
        env:
          CI: '1'
          NODE_ENV: production
        run: |
          echo "Archive step simulated or executed via xcodebuild"

      - name: Generate ExportOptions.plist & Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "Export with scrubbed logs: <KEY_ID> and <ISSUER_ID>"

      - name: Clean up credentials
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc_private_keys"

      - name: Upload scrubbed logs on failure only (retention 1 day)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-xcodebuild-logs-${{ github.run_number }}
          path: /tmp/xcodebuild-*.log
          retention-days: 1

  tag:
    name: Create Git Tag
    needs: build
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Create and push tag vX.Y.Z-bNNNN
        run: |
          echo "Tagged release"
