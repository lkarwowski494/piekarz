name: Build & Upload to TestFlight (iOS)

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Notatka do wydania (opcjonalnie)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=3072
  FORCE_COLOR: '1'
  APP_SCHEME: 'Piekarz'
  APP_DIR: 'Piekarz'
  BUNDLE_ID: 'com.apps4brew.baker'
  BUILD_BASE: '1000'

jobs:
  # Bramka stref czasu (07-jakosc-002): te same strefy i ta sama komenda co tests-tz.yml.
  # Czerwona strefa zatrzymuje build; wszystkie strefy biegną do końca, żeby log pokazał komplet.
  tz-matrix:
    name: Jest w 7 strefach czasu (przed buildem)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Pełna historia z tagami: test 079 sprawdza każdy tag v*-b* (M1-audytor-generalny-110, D-331)
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Run Jest in every timezone
        run: |
          failed=""
          for tz in UTC Europe/Warsaw America/New_York America/Los_Angeles Asia/Tokyo Australia/Sydney Pacific/Auckland; do
            echo "::group::Jest (TZ=$tz)"
            if ! TZ="$tz" npm test; then
              failed="$failed $tz"
              echo "::error::Czerwona strefa: $tz"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Testy czerwone w strefach:$failed"
            exit 1
          fi

  # Bramka E2E (M1-audytor-generalny-068, 07-jakosc-004; D-286 DEC-18 a): build tylko po zielonym iOS E2E
  # (e2e-ios.yml) na tym samym SHA albo na przodku, od którego różnica nie dotyka ścieżek E2E (wyjątek D-276).
  # Build 1023 poszedł z 2ef8870a po czerwonym E2E #96. Bez sekretów i bez środowiska release; token tylko do odczytu.
  e2e-sha:
    name: Zielone iOS E2E na tym SHA (przed buildem)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check e2e-ios.yml result for GITHUB_SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/e2e-ios.yml/runs?status=completed&per_page=100" > "$RUNNER_TEMP/e2e-przebiegi.json"
          node scripts/ci/e2e-na-sha.mjs --sha "$GITHUB_SHA" --przebiegi "$RUNNER_TEMP/e2e-przebiegi.json"

  build:
    name: Archive & Upload (.ipa -> TestFlight)
    needs: [tz-matrix, e2e-sha]
    # Klucz App Store Connect (podpis w chmurze i wysyłka) tylko po akceptacji właściciela: środowisko GitHub
    # `release` z wymaganym recenzentem (D-314, M1-audytor-generalny-082). Bramka stref czasu biegnie wcześniej, bez środowiska.
    environment: release
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build_number: ${{ steps.ver.outputs.build_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify commit is ancestor of master (BR-REL-005)
        run: |
          git fetch origin master --depth=50
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Błąd BR-REL-005: Wydawany commit $GITHUB_SHA nie pochodzi z gałęzi origin/master!"
            exit 1
          fi

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode 26 (iOS 26 SDK)
        run: bash .github/scripts/select-xcode.sh 26

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      - name: Guard against test/mock flags in release build
        run: |
          for var in EXPO_PUBLIC_STORE_FAKE EXPO_PUBLIC_E2E EXPO_PUBLIC_MOCK_AUTH EXPO_PUBLIC_DEMO_MODE; do
            val="${!var:-}"
            if [ -n "$val" ] && [ "$val" != "0" ]; then
              echo "::error::Flaga testowa $var=$val nie może być ustawiona w wydaniu produkcyjnym!"
              exit 1
            fi
          done

      # Te same kontrole co lokalnie i w CI, także check:size i lint (M1-audytor-generalny-167)
      - name: Run quality gates (npm run verify)
        run: npm run verify

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Compute & set monotonic build number
        id: ver
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Nieprawidłowy format wersji w app.json: '$VERSION' (wymagane X.Y lub X.Y.Z)"
            exit 1
          fi
          BUILD_NUMBER=$((BUILD_BASE + GITHUB_RUN_NUMBER))
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Nieprawidłowy numer buildu: '$BUILD_NUMBER'"
            exit 1
          fi
          echo "Ustawianie wersji $VERSION ($BUILD_NUMBER)"
          # Jedyne źródło numeru buildu (app.json bez buildNumber, eas.json bez autoIncrement) [M1-audytor-generalny-077]
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "ios/$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "ios/$APP_DIR/Info.plist"
          sed -i '' -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $VERSION;/g" "ios/$APP_SCHEME.xcodeproj/project.pbxproj"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Verify native iOS project invariants
        run: node scripts/verify-native.mjs

      - name: Cache CocoaPods
        id: pods-cache
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-xcode26-${{ hashFiles('ios/Podfile.lock', 'package-lock.json') }}
          restore-keys: |
            pods-${{ runner.os }}-xcode26-

      - name: Install CocoaPods
        working-directory: ios
        run: |
          if [ "${{ steps.pods-cache.outputs.cache-hit }}" != "true" ]; then
            pod install --repo-update
          else
            pod install
          fi

      - name: Verify PrivacyInfo.xcprivacy after pod install
        run: |
          PRIV="ios/$APP_DIR/PrivacyInfo.xcprivacy"
          test -f "$PRIV" || { echo "::error::Brak $PRIV"; exit 1; }
          plutil -lint "$PRIV"
          for cat in NSPrivacyAccessedAPICategoryUserDefaults NSPrivacyAccessedAPICategoryFileTimestamp NSPrivacyAccessedAPICategorySystemBootTime NSPrivacyAccessedAPICategoryDiskSpace; do
            grep -q "$cat" "$PRIV" || { echo "::error::Brak kategorii $cat w $PRIV"; exit 1; }
          done
          grep -q "PrivacyInfo.xcprivacy" "ios/$APP_SCHEME.xcodeproj/project.pbxproj" || {
            echo "::error::PrivacyInfo.xcprivacy nie jest podpięty w project.pbxproj"
            exit 1
          }

      - name: Archive (Release, unsigned build step)
        env:
          CI: '1'
          NODE_ENV: production
          # react-native-xcode.sh emituje mapę źródeł JS, gdy SOURCEMAP_FILE jest ustawione (M1-audytor-generalny-068)
          SOURCEMAP_FILE: ${{ runner.temp }}/sourcemaps/main.jsbundle.map
        run: |
          set -o pipefail
          mkdir -p "$(dirname "$SOURCEMAP_FILE")"
          xcodebuild archive \
            -workspace "ios/$APP_SCHEME.xcworkspace" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$APP_SCHEME.xcarchive" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID || '8NQ9GHY8GF' }}" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$VERSION" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee /tmp/xcodebuild-archive.log

          if [ ! -d "$RUNNER_TEMP/$APP_SCHEME.xcarchive/Products/Applications/$APP_SCHEME.app" ]; then
            echo "::error::Archiwum .xcarchive nie powstało — ostatnie 80 linii logu:"
            tail -80 /tmp/xcodebuild-archive.log
            exit 1
          fi

          if ! test -s "$SOURCEMAP_FILE"; then
            echo "::error::Brak mapy źródeł JS: $SOURCEMAP_FILE"
            exit 1
          fi

      - name: Upload JS source map (every build, retention 90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-sourcemap-${{ env.VERSION }}-b${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/sourcemaps/main.jsbundle.map
          if-no-files-found: error
          retention-days: 90

      - name: Prepare App Store Connect API Key (.p8) after pod install & archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 || secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '8NQ9GHY8GF' }}
        run: |
          set +x
          for req in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!req:-}" ]; then
              echo "::error::Brak wymaganego sekretu GitHub: $req (zobacz docs/15-app-store.md)"
              exit 1
            fi
          done
          if ! [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{6,16}$ ]]; then
            echo "::error::Nieprawidłowy format ASC_KEY_ID"
            exit 1
          fi
          umask 077
          KEY_DIR="$RUNNER_TEMP/asc_private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          if [[ "$ASC_KEY_P8_BASE64" =~ "BEGIN PRIVATE KEY" ]]; then
            printf '%s\n' "$ASC_KEY_P8_BASE64" > "$KEY_PATH"
          else
            printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "::error::Zdekodowany klucz .p8 nie zawiera nagłówka BEGIN PRIVATE KEY"
            rm -f "$KEY_PATH"
            exit 1
          fi
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Generate ExportOptions.plist & Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '8NQ9GHY8GF' }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>destination</key>
            <string>upload</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>testFlightInternalTestingOnly</key>
            <false/>
          </dict>
          </plist>
          EOF

          set +e
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$APP_SCHEME.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | sed \
              -e "s/${ASC_KEY_ID}/<KEY_ID>/g" \
              -e "s/${ASC_ISSUER_ID}/<ISSUER_ID>/g" \
              -e "s/${APPLE_TEAM_ID}/<TEAM_ID>/g" \
              > /tmp/xcodebuild-export.log
          RC=${PIPESTATUS[0]}
          set -e

          if [ "$RC" -ne 0 ]; then
            echo "::error::Eksport i wysyłka do TestFlight nie powiodły się (kod $RC). Ostatnie 80 linii:"
            tail -80 /tmp/xcodebuild-export.log
            exit "$RC"
          fi
          tail -30 /tmp/xcodebuild-export.log

      # 032 (KO-025, 2026-11-10): pełny log eksportu i wysyłki jako artefakt — dowód, czy xcodebuild wysłał symbole (dSYM),
      # bo tail -30 ich nie pokazuje (TF #25, job 129890129906). Log ma już zamaskowane KEY_ID, ISSUER_ID i TEAM_ID (sed wyżej);
      # przed wysyłką artefaktu kontrola wzorców sekretów: przy trafieniu log jest usuwany i artefaktu nie ma (bez przerywania
      # wydania, które już poszło). Ostrzeżenia o symbolach trafiają do podsumowania joba.
      - name: Full export log (secret scan, symbol warnings)
        id: log_eksportu
        if: always()
        run: |
          LOG=/tmp/xcodebuild-export.log
          if [ ! -s "$LOG" ]; then echo "bezpieczny=false" >> "$GITHUB_OUTPUT"; echo "Brak logu eksportu (krok eksportu się nie wykonał)."; exit 0; fi
          WZORY='BEGIN [A-Z ]*PRIVATE KEY|eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}|[Bb]earer [A-Za-z0-9._~+/=-]{20,}|AuthKey_[A-Z0-9]{6,16}\.p8'
          # bez pipefail (domyślny bash -e): kod potoku = kod wc, więc brak trafień grep nie przerywa kroku
          TRAFIENIA=$(grep -E "$WZORY" "$LOG" | wc -l | tr -d ' ')
          if [ "$TRAFIENIA" -ne 0 ]; then
            echo "::warning::Log eksportu ma $TRAFIENIA linii pasujących do wzorców sekretów — log usunięty, bez artefaktu."
            rm -f "$LOG"; echo "bezpieczny=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "bezpieczny=true" >> "$GITHUB_OUTPUT"
          SYMBOLE=$(grep -iE 'dsym|symbol' "$LOG" | sed -E 's/[[:space:]]+/ /g' | sort | uniq -c | sort -rn | head -20)
          {
            echo "### Eksport: linie o symbolach (dSYM) — pełny log w artefakcie testflight-export-log-${GITHUB_RUN_NUMBER}"
            echo "Linii logu: $(wc -l < "$LOG" | tr -d ' '); linii o symbolach: $(grep -iE 'dsym|symbol' "$LOG" | wc -l | tr -d ' ')"
            if [ -n "$SYMBOLE" ]; then echo '```'; printf '%s\n' "$SYMBOLE"; echo '```'; else echo "Brak linii o symbolach w logu."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full export log (retention 3 days)
        if: always() && steps.log_eksportu.outputs.bezpieczny == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: testflight-export-log-${{ github.run_number }}
          path: /tmp/xcodebuild-export.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Clean up credentials
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc_private_keys" "$RUNNER_TEMP/ExportOptions.plist"

      - name: Write release summary
        if: always()
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          {
            echo "## Wydanie TestFlight — $APP_SCHEME"
            echo ""
            echo "| Parametr | Wartość |"
            echo "| :--- | :--- |"
            echo "| **Bundle ID** | \`$BUNDLE_ID\` |"
            echo "| **Wersja** | \`${VERSION:-?}\` |"
            echo "| **Numer buildu** | \`${BUILD_NUMBER:-?}\` |"
            echo "| **Commit** | \`${GITHUB_SHA}\` |"
            echo "| **Notatka** | ${RELEASE_NOTES:-*(brak)*} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scrubbed logs on failure only (retention 1 day)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-xcodebuild-logs-${{ github.run_number }}
          path: /tmp/xcodebuild-*.log
          retention-days: 1

  tag:
    name: Create Git Tag
    needs: build
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create and push tag vX.Y.Z-bNNNN
        env:
          VERSION: ${{ needs.build.outputs.version }}
          BUILD: ${{ needs.build.outputs.build_number }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || ! [[ "$BUILD" =~ ^[0-9]+$ ]]; then
            echo "::error::Nieprawidłowe dane wyjściowe wersji lub buildu: VERSION='$VERSION' BUILD='$BUILD'"
            exit 1
          fi
          TAG="v${VERSION}-b${BUILD}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "$TAG" --force

      # Artefakt żyje 90 dni, a build wydany w App Store działa dłużej: mapa zostaje
      # na stałe w wydaniu GitHub tego tagu (M1-audytor-generalny-142).
      - name: Download JS source map of this build
        uses: actions/download-artifact@v4
        with:
          name: testflight-sourcemap-${{ needs.build.outputs.version }}-b${{ needs.build.outputs.build_number }}
          path: ${{ runner.temp }}/sourcemaps

      - name: Attach source map to GitHub release vX.Y.Z-bNNNN
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILD: ${{ needs.build.outputs.build_number }}
        run: |
          TAG="v${VERSION}-b${BUILD}"
          MAP="$RUNNER_TEMP/sourcemaps/main.jsbundle.map"
          test -s "$MAP"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$MAP" --clobber
          else
            gh release create "$TAG" "$MAP" --prerelease --verify-tag \
              --title "$TAG" --notes "Build TestFlight ${VERSION} (${BUILD}), commit ${GITHUB_SHA}. Plik main.jsbundle.map: mapa źródeł JS do symbolizacji awarii."
          fi
