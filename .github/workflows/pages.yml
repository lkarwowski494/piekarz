name: Deploy GitHub Pages

on:
  # Tylko ręcznie: strony Piekarza publikuje repo apps4brew-www (apps4brew.com/piekarz/); Pages tego repo
  # nie jest skonfigurowane, więc automatyczny przebieg przy pushu kończył się „failure” (właściciel 2026-10-21: maile).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
