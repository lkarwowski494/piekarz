name: iOS E2E (Maestro na symulatorze)

# Prawdziwe E2E (M1-audytor-generalny-037): build Release na symulator, Maestro CLI
# dla scenariuszy głównego przepływu z .maestro/e2e/ i kontrola negatywna, która musi paść.
# Interpreter scenariuszy w Jest (tests/maestro-flows.test.tsx) nie jest E2E i działa w ci.yml.

on:
  # Tylko master/main: runnery macOS są rzadko dostępne (ok. 15:00–24:00 Warszawa wcale), a przebiegi
  # na gałęziach napraw czekały w kolejce i kończyły się jako „failure” (właściciel 2026-10-21: maile run failed).
  # Gałąź napraw: ręcznie przez workflow_dispatch.
  push:
    branches: [master, main]
    paths:
      - 'app/**'
      - 'src/**'
      - '.maestro/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-ios.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'app/**'
      - 'src/**'
      - '.maestro/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  MAESTRO_VERSION: "2.11.0"
  MAESTRO_CLI_NO_ANALYTICS: 1
  MAESTRO_DRIVER_STARTUP_TIMEOUT: 480000
  # Flaga dostępu E2E (pełny Pro) tylko w env kroku pierwszego buildu, nie tutaj: drugi build (Basic) nie może
  # jej dziedziczyć [M3 E2E-basic, decyzja M1 2026-10-23 wariant a].

jobs:
  e2e:
    name: Maestro E2E on iOS Simulator
    # macos-14 jest wycofywany (actions/runner-images, odczyt 2026-10-19); repo publiczne: standardowe runnery bez opłat.
    runs-on: macos-26
    # +30 min na drugi build Release (przyrostowy: ten sam derivedData, nowy bundle JS) i scenariusze Basic [M3 E2E-basic]
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --clean

      - name: Build Release for simulator
        env:
          # Build E2E z dostępem (symulator nie ma StoreKit): Metro wstawia flagę przy budowaniu; testflight.yml jej
          # nie dopuszcza (krok „Guard against test/mock flags”). Wybór P-037 a [M1-audytor-generalny-037].
          EXPO_PUBLIC_E2E: "1"
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 80
          # Skrót bundle JS z flagą: build Basic musi dać inny (kontrola, że bundle zbudował się od nowa)
          echo "BUNDLE_E2E_SHA=$(shasum -a 256 build/Build/Products/Release-iphonesimulator/*.app/main.jsbundle | cut -d ' ' -f 1)" >> "$GITHUB_ENV"

      - name: Boot simulator and install app
        run: |
          UDID=$(xcrun simctl list devices available -j | node -e '
            const d = JSON.parse(require("fs").readFileSync(0, "utf8")).devices;
            const ios = Object.keys(d).filter((k) => k.includes("iOS")).sort().reverse();
            for (const k of ios) { const p = d[k].find((x) => x.name.startsWith("iPhone")); if (p) { console.log(p.udid); process.exit(0); } }
            process.exit(1);')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -n 1)
          xcrun simctl install "$UDID" "$APP"

      # Maestro nadaje zgody iOS (launchApp: permissions) przez applesimutils; bez niego systemowe okno zgody
      # na powiadomienia zasłania ekran (przebiegi 39581379222, 39591487157) [M1-audytor-generalny-037]
      - name: Install applesimutils
        run: |
          brew tap wix/brew
          # Homebrew odmawia formuł z niezaufanego tapu bez jawnej zgody (przebieg 39599674842)
          brew trust --formula wix/brew/applesimutils
          brew install applesimutils
          applesimutils --version

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Aplikacja startuje w języku systemu (048): scenariusze po id przechodzą w pl_PL i en_US (07-jakosc-501)
      - name: Run E2E flows (.maestro/e2e, pl_PL)
        run: |
          xcrun simctl spawn "$UDID" defaults write -g AppleLanguages -array pl-PL
          xcrun simctl spawn "$UDID" defaults write -g AppleLocale -string pl_PL
          xcrun simctl shutdown "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          maestro --device "$UDID" test .maestro/e2e --format junit --output maestro-e2e-pl.xml

      - name: Run E2E flows (.maestro/e2e, en_US)
        run: |
          xcrun simctl spawn "$UDID" defaults write -g AppleLanguages -array en-US
          xcrun simctl spawn "$UDID" defaults write -g AppleLocale -string en_US
          xcrun simctl shutdown "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          maestro --device "$UDID" test .maestro/e2e --format junit --output maestro-e2e-en.xml

      - name: Negative control must fail
        run: |
          if ! maestro --device "$UDID" test .maestro/kontrola-negatywna; then
            echo "Kontrola negatywna padła zgodnie z oczekiwaniem."
          else
            echo "::error::Kontrola negatywna przeszła — Maestro nie wykrywa brakującego elementu."
            exit 1
          fi

      # E2E w Basic (decyzja M1 2026-10-23, wariant a): drugi build Release BEZ EXPO_PUBLIC_E2E w tym samym jobie, żeby
      # nie powtarzać npm ci, prebuild, kompilacji natywnej, bootu symulatora i instalacji narzędzi. Ten sam derivedData:
      # natywny kod bez zmian, od nowa tylko bundle JS (flaga działa wyłącznie w JS, src/lib/app-access.ts). Bez furtki
      # „wymuś Basic” w kodzie aplikacji [M3 E2E-basic].
      - name: Build Release for simulator (Basic, without EXPO_PUBLIC_E2E)
        run: |
          set -o pipefail
          if [ -n "${EXPO_PUBLIC_E2E:-}" ]; then
            echo "::error::EXPO_PUBLIC_E2E jest ustawiona — build Basic musi być bez dostępu E2E."
            exit 1
          fi
          # Bez pamięci transformacji Metro z buildu z flagą (wartość EXPO_PUBLIC_* jest wstawiana przy transformacji)
          rm -rf "${TMPDIR:-/tmp}"/metro-* "${TMPDIR:-/tmp}"/haste-map-* node_modules/.cache/metro
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 80
          BUNDLE_BASIC_SHA=$(shasum -a 256 build/Build/Products/Release-iphonesimulator/*.app/main.jsbundle | cut -d ' ' -f 1)
          if [ "$BUNDLE_BASIC_SHA" = "$BUNDLE_E2E_SHA" ]; then
            echo "::error::main.jsbundle Basic jest taki sam jak w buildzie z EXPO_PUBLIC_E2E — bundle nie zbudował się od nowa."
            exit 1
          fi

      - name: Install Basic build on simulator
        run: |
          BUNDLE_ID=$(node -p 'require("./app.json").expo.ios.bundleIdentifier')
          xcrun simctl uninstall "$UDID" "$BUNDLE_ID" || true
          APP=$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -n 1)
          xcrun simctl install "$UDID" "$APP"

      # Scenariusze po id: jeden przebieg (język symulatora z poprzedniego kroku, en_US) wystarcza
      - name: Run E2E flows in Basic (.maestro/e2e-basic)
        run: maestro --device "$UDID" test .maestro/e2e-basic --format junit --output maestro-e2e-basic.xml

      - name: Upload Maestro report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-e2e
          path: |
            maestro-e2e-pl.xml
            maestro-e2e-en.xml
            maestro-e2e-basic.xml
            ~/.maestro/tests
          if-no-files-found: ignore
          retention-days: 7
